name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/postfix-exporter/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@8513fd44855c269a7c10144d59cf6fae60fa4702 # v1.0.46
    secrets: inherit
    with:
      upload_as_oci: true
      chart_name: postfix-exporter
