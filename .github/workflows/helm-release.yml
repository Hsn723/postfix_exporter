name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/postfix-exporter/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@ff0eb24529ec1fa062dca834a74a7a37738d7ce1 # v1.0.43
    secrets: inherit
    with:
      upload_as_oci: true
      chart_name: postfix-exporter
