name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/postfix-exporter/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@a48f27c3e6fa5b0a099473cd4ff0aa71dafb6569 # v1.0.40
    secrets: inherit
    with:
      upload_as_oci: true
      chart_name: postfix-exporter
