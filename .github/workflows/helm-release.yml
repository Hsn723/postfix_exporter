name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/postfix-exporter/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@47eeeef281da373b713e33dee8f0696a7c83e1c0 # v1.0.47
    secrets: inherit
    with:
      upload_as_oci: true
      chart_name: postfix-exporter
