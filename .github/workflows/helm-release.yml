name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/postfix-exporter/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@4281946d97b73d45fcb15360e18ecdc4aeeb3dae # v1.0.42
    secrets: inherit
    with:
      upload_as_oci: true
      chart_name: postfix-exporter
