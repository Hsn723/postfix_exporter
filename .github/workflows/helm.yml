name: Lint and test Helm charts
on:
  pull_request:
    paths:
      - 'charts/**'
      - '!**.md'
permissions:
  contents: read
jobs:
  lint-test:
    uses: hsn723/actions/.github/workflows/helm-lint.yml@bd05ba2349bb5069aa84e061397f491ef75ffe4e # v1.0.49
    with:
      helm_extra_set_args: "--set=deployment.extraArgs={--no-postfix.logfile_must_exist}"
