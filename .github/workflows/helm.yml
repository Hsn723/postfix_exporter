name: Lint and test Helm charts
on:
  pull_request:
    paths:
      - 'charts/**'
      - '!**.md'
permissions:
  contents: read
jobs:
  lint-test:
    uses: hsn723/actions/.github/workflows/helm-lint.yml@0ff0251ffdcdeeb72d81fcf7b23fe85ad700aa81 # v1.0.51
    with:
      helm_extra_set_args: "--set=deployment.extraArgs={--no-postfix.logfile_must_exist}"
