name: main
on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master
permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write
jobs:
  verify:
    uses: hsn723/actions/.github/workflows/verify.yml@bd05ba2349bb5069aa84e061397f491ef75ffe4e # v1.0.49
    secrets: inherit
    with:
      lint-pre: |
        make libsystemd-dev
      additional-dry-run-setup: |
        make libsystemd-dev
        make gcc-aarch64-linux-gnu
