name: Tag and release
on:
  push:
    branches:
      - master
    paths:
      - VERSION
permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/release.yml@bd05ba2349bb5069aa84e061397f491ef75ffe4e # v1.0.49
    secrets: inherit
    with:
      additional-setup: |
        make libsystemd-dev
        make gcc-aarch64-linux-gnu
      upload-image-sbom: false
      disable-sudo: false
