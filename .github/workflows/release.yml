name: Tag and release
on:
  push:
    branches:
      - master
    paths:
      - VERSION
permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/release.yml@8513fd44855c269a7c10144d59cf6fae60fa4702 # v1.0.46
    secrets: inherit
    with:
      additional-setup: |
        make libsystemd-dev
        make gcc-aarch64-linux-gnu
      upload-image-sbom: false
      disable-sudo: false
